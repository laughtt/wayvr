# ANYTHING BELOW HERE IS MANAGED FROM THE DASHBOARD.
# The settings are here for reference only.
# Probably don't include them in your config file.

## The watch will be enabled
#enable_watch: true

## The bottom of the watch will list sets instead of overlays.
#sets_on_watch: false

## Force an alternative method for Wayland desktop capture.
## `auto`: default
## `pw_fallback`: Pipewire-based software capture
## `screencopy`: Software capture that works on some Wayland compositors
## Other values that were previously here are no longer supported.
#capture_method: auto

## Monado/WiVRn only. Do not send controller input to other VR apps
## while WayVR is being hovered. Either hand will block both hand inputs!
#block_game_input: false

## Do not block input when the watch is hovered.
#block_game_input_ignore_watch: true

## Monado/WiVRn only. Do not send hand poses when interacting with the
## keyboard.
#block_poses_on_kbd_interaction: true

## How fast to drag when the space drag feature is activated
#space_drag_multiplier: 1.0

## Setting this to false will make space_drag
## only affect the vertical axis (Y).
#space_drag_unlocked: true

## Monado/WiVRn only. When enabled, the space_rotate binding
## can rotate in any axis. Imagine horizon mode².
#space_rotate_unlocked: false

## Space gravity: downward acceleration speed
#space_gravity_gravity: 2.0

## Space gravity: velocity damping (0.98 = gentle slowdown, 0.5 = heavy drag)
#space_gravity_damping: 0.98

## Space gravity: multiplier for "throwing" yourself via space drag momentum
#space_gravity_fling_strength: 1.0

## Space gravity: floor height (Y position where gravity stops)
#space_gravity_floor_height: 0.0

## Space gravity: ground friction when touching the floor
#space_gravity_ground_friction: 1.0

## Monado/WiVRn only. Use passthrough camera if the headset supports it.
## If disabled, the skybox will be shown.
#use_passthrough: true

## Monado/WiVRn only. Display a skybox when no scene application is running.
## If disabled, there will be no background rendered (solid black).
#use_skybox: true

## Monado/WiVRn only. Opacity of the floor grid if use_skybox is enabled.
#grid_opacity: true

## Hide the help popup that appears on your hand while grabbing an overlay
#hide_grab_help: false

## Smoothing applied to the pointer.
## 1.0 → no smoothing
## 0.1 → too much smoothing
#pointer_lerp_factor: 0.3

## If your upright screen is not displaying correctly, try enabling this.
#upright_screen_fix: false

## If you're seeing the cursor twice, try enabling this.
#double_cursor_fix: false
# 
## Use 12h instead of 24h watch.
#clock_12h: false

## Set whether notifications should be shown at all
#notifications_enabled: true

## Set whether notifications should make a sound
#notifications_sound_enabled: true

## Toggle keyboard click sound
#keyboard_sound_enabled: true

## Multiplier for animation speed. 2.0 → double speed, 0.5 → half speed
#animation_speed: 1.0

## Adjust this between 0..1 for a more rectangular feel.
#round_multiplier: 1.0

## Render screens & mirrors at a lower resolution.
## Avoids aliasing on 4K+ screens, and also saves VRAM
#screen_render_down: false

## For how much time mouse motion events should be stopped after clicking?
## Prevents accidental dragging various GUI elements or links, making it easier to click
#click_freeze_time_ms: 300

## Fixes behavior when the desktop environment
## expects the mouse buttons to be swapped
#left_handed_mouse: false

## Make scroll events inverted in X/Y axis
#invert_scroll_direction_x: false
#invert_scroll_direction_y: false

## How many seconds to buttons need to be held
## before it's considered a long press
#long_press_duration: 1.0

## Change speed of scrolling
# 0.5 → half the speed
# 2.0 → twice the speed
#scroll_speed: 1.0

## Enable / disable sliding windows back and forth with the scroll action
#allow_sliding: true

## When enabled, the mouse pointer will not be moved on the screen, unless the trigger is touched
## allowing for moving both pointers off the screens to the keyboard, while keeping the cursor position
## unchanged, for when the desktop is configured to move the focus with the mouse cursor
#focus_follows_mouse_mode: false

## OpenXR only. Use eye gaze (XR_EXT_eye_gaze_interaction) as an extra pointer.
## Gaze only hovers; click with a controller trigger while looking ("look and click").
## A controller ray that is pointing at an overlay always has priority over gaze.
## Does nothing if the runtime has no eye tracking.
## This is the ONE gate for gaze input: while it is false the eyes never hover, click, focus, move the cursor or
## report a target (gaze_over_controllers, gaze_dwell_ms and the eye-tracking handsfree modes do nothing; the
## handsfree eye modes fall back to the head pointer). Only the visual gaze dot (gaze_laser) shows.
#gaze_pointer: false

## Gaze has priority over controller rays while gaze is valid: controllers do not hover/point, a controller
## trigger clicks where you look. Use when controller rays always sit on the overlays (e.g. fixed controller poses).
#gaze_over_controllers: false

## Gaze dwell-click: keep looking at the same spot for this many milliseconds to click.
## 0 → disabled
#gaze_dwell_ms: 0

## Smoothing applied to the gaze cursor (One Euro filter).
## 0.0 → no smoothing
## 0.5 → default
## 1.0 → heavy smoothing (laggy)
#gaze_smoothing: 0.5

## Fixation dead zone in degrees. The gaze cursor stays still while your gaze moves less than this.
#gaze_deadzone_deg: 0.6

## OpenXR only. Silent gaze tracking: the gaze is ray-cast every frame but never hovers, clicks or moves
## the mouse. `wayvrctl gaze` prints what you are looking at (overlay, UV, desktop pixel, fixation).
#gaze_target: false

## OpenXR only. A subtle marker where your eyes land (turns silent gaze tracking on).
## Toggle at run time: `wayvrctl gaze-laser on|off|toggle`. Hidden during blinks and invalid frames.
#gaze_laser: false

## dot → a tiny dot at the hit point; ray → a short thin ray ending there
#gaze_laser_style: dot

## Laser opacity, 0.0 .. 1.0
#gaze_laser_alpha: 0.35

## Number badges (1 main, 2 left, 3 right, 4 up, 5 up-left, 6 up-right) at the top centre of each desk screen.
## on_demand → shown ~5 s when a screen is added or moved, or on `wayvrctl screen-numbers flash [N]`; always; off.
## Change at run time: `wayvrctl screen-numbers off|ondemand|always|show|hide|flash [N]`.
#screen_numbers: on_demand

## Shortest fixation (ms) that counts as "looked at" for `wayvrctl gaze`
#gaze_fixation_ms: 200

## OpenXR only. Draw simple semi-transparent hand skeletons (needs XR_EXT_hand_tracking).
## Hidden while the runtime reports the hand as untracked. Does nothing without hand tracking.
#show_hands: true

## OpenXR only. Pinch (XR_EXT_hand_interaction) acts as click on overlays, aiming with the hand aim pose.
## Needs a restart to take effect.
#hand_pinch_click: true
